name: "CI/CD & Sovereign Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches: ["main", "feat/*", "fix/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Format Check"
        run: cargo fmt --check

      - name: "Cargo Check"
        run: cargo check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --all-targets

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish Pult Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [check-and-test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Compile Pult Multiarch Binaries"
        run: |
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64 estático)..."
          unset CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          cargo build --release --target x86_64-unknown-linux-musl -p pult-tui || \
            cargo zigbuild --release --target x86_64-unknown-linux-musl -p pult-tui

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p pult-tui || \
            cargo build --release --target aarch64-unknown-linux-musl -p pult-tui

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p pult-tui || \
            cargo build --release --target x86_64-pc-windows-gnu -p pult-tui

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          # 1. Empacotar Linux AMD64
          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/pult-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release pult \
              -C "$PWD" install.sh README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/pult-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release pult
          fi

          # 2. Empacotar Linux ARM64
          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/pult-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release pult \
              -C "$PWD" install.sh README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/pult-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release pult
          fi

          # 3. Empacotar Windows AMD64
          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/pult-${VERSION}-windows-amd64.zip" \
              pult.exe "$GITHUB_WORKSPACE/install.sh" "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/pult-${VERSION}-windows-amd64.zip" \
              pult.exe
            cd "$GITHUB_WORKSPACE"
          fi

          # 4. Incluir standalone install.sh
          cp install.sh "dist/packages/install.sh"

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Enviando pacotes para o Cloudflare R2 (twolp-bucket / bucket.2lp.in)..."
          for PKG in dist/packages/*; do
            [ -f "$PKG" ] || continue
            PKG_NAME=$(basename "$PKG")
            npx wrangler r2 object put "twolp-bucket/downloads/pult/${CHANNEL}/${PKG_NAME}" \
              --file="$PKG" --remote || true
          done

      - name: "Rotate Manifest & Commit to Banca"
        env:
          GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          echo "★ Clonando repositório da Banca para rotação e retenção..."
          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/pult" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="pult-${VERSION}-${ARCH}.${EXT}"

              HASH=$(grep "$PKG_FILE" "$GITHUB_WORKSPACE/dist/packages/SHA256SUMS" | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://bucket.2lp.in/downloads/pult/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/pult/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "pult"
            done

            git config user.name "Pult Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/pult/index.json site/downloads/catalog.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate pult release to ${VERSION} (#12)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto da Banca já estava atualizado."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

      - name: "Deploy Documentation Portal to Cloudflare Pages"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -d site ]; then
            echo "★ Publicando portal oficial em pult.2lp.in..."
            npx wrangler pages deploy site --project-name=pult || npx wrangler deploy || true
          fi
